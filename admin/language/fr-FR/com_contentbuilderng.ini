COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_DISPLAY_OPTIONS_HINT="<strong class='d-block mb-1'>Limiter les valeurs et masquer des éléments de présentation</strong><span class='d-block'><code>limit=10</code> conserve les 10 premières valeurs après <code>sort=</code> et <code>dir=</code>. Les options numériques sont écrites sans guillemets.</span><span class='d-block'><code>hide=&quot;title|total|values|graph&quot;</code> accepte les combinaisons séparées par <code>|</code>. <code>title</code> masque le titre d’un bloc ou d’une Card défini par <code>labels=&quot;title=...&quot;</code>&#8239;; <code>values</code> masque la liste textuelle des libellés et valeurs&#8239;; <code>graph</code> conserve cette liste textuelle légère. Masquer les trois éléments du résultat est refusé. L’ancienne syntaxe <code>total=hide</code> n’est plus prise en charge.</span><span class='d-block'><code>{CBStats id=15 field=&quot;Groupe&quot; output=&quot;bar&quot; labels=&quot;title=Répartition&quot; hide=&quot;title|values&quot; card=v1}</code></span><span class='d-block'><code>{CBStats id=15 field=&quot;Ville&quot; output=&quot;radar&quot; hide=&quot;graph|total&quot;}</code></span><span class='d-block'><code>index.php?option=com_contentbuilderng&amp;task=api.display&amp;format=json&amp;action=cbstats&amp;id=15&amp;field=Ville&amp;output=bar&amp;hide=graph%7Ctotal</code></span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_GROUPS_HINT="<strong class='d-block mb-1'>Groupes de valeurs</strong><span class='d-block'><code>groups=&quot;18-24;25-29;30+&quot;</code> définit des intervalles numériques inclusifs. <code>groups=&quot;1,2,7,9=Groupe 1;3,4,8=Groupe 2&quot;</code> regroupe des valeurs explicites non contiguës sous des libellés d’affichage. L’ordre de déclaration est conservé&#8239;; les chevauchements sont autorisés et chaque groupe est compté indépendamment. Les valeurs qui ne correspondent à aucun groupe restent des catégories individuelles après les groupes.</span><span class='d-block'>Avec <code>groups=</code>, le total affiché est la somme de tous les résultats affichés après regroupement et limitation. Des groupes qui se chevauchent peuvent donc compter un même enregistrement plusieurs fois. Utilisez <code>output=total</code> pour obtenir le nombre réel d’enregistrements filtrés. La syntaxe inline <code>groups=</code> est prioritaire sur <code>groupset=</code> et <code>titles=</code> peut remplacer les libellés des groupes. Le radar est recommandé avec 4 à 6 axes.</span>"
