COM_CONTENTBUILDERNG_API_CBSTATS_EXPORT_HELP="Ajoutez <code>export=manual</code> pour afficher le Title, les Values et le Total finaux, avec une syntaxe <code>source=manual</code> complète et visible ainsi qu’un bouton de copie centré. Les valeurs exportées sont les résultats finaux affichés après les filtres, les ajouts, <code>titles=</code>, le tri, la direction et la correction des valeurs négatives. Les titres finaux des catégories sont directement écrits dans <code>values=</code> ; <code>titles=</code> n’est pas recopié. Seule la valeur exacte <code>manual</code> active cet export ; les autres valeurs de export sont ignorées."
COM_CONTENTBUILDERNG_API_CBSTATS_CASE_HELP="Le nom de la balise CBStats, les noms des options et les mots-clés fermés ne sont pas sensibles à la casse ; l’écriture officielle en minuscules reste recommandée. Les valeurs libres et métier conservent leur casse. Utilisez la casse exacte du nom technique du champ (par exemple <code>GroupeVcmb</code>) pour une syntaxe portable, même si le résolveur actuel accepte aussi les variantes de casse."
