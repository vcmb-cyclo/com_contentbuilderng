COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_DESIGN_TEXT="Créez une vue par cas d'usage fonctionnel clairement identifié : soumission publique, liste back-office, page de détail, workflow interne. Un nom explicite et une source de données bien définie évitent les vues polyvalentes difficiles à maintenir."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG="Ordre de configuration recommandé"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG_TEXT="Commencez par la source de données et les permissions (voir, créer, éditer, publier), puis passez aux champs (inclusion en liste, recherche, lien cliquable, éditable), à l'ordre, à la pagination, aux filtres, aux plugins de thème et aux options avancées."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG_WARN="Configurer les permissions en dernier est une source d'erreurs fréquente — définissez-les en premier."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_PROD="Mise en production"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_PROD_TEXT="Avant de rendre une vue accessible au public : testez les parcours avec au moins deux profils utilisateurs différents, vérifiez les messages de validation et d'erreur, confirmez le comportement des actions de masse et de la publication, puis validez les performances sur une liste volumineuse."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_LIST="Commandes de la liste des vues"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_LIST_TEXT="Survolez un titre de colonne pour afficher sa description ; les titres triables restent cliquables. La colonne Debug se trouve juste avant Publié. Une icône de bug verte indique que le Debug de la vue est actif et permet de le désactiver. Utilisez Actions > Debug ou Actions > Non debug pour modifier toutes les vues sélectionnées. La même icône de bug verte identifie le Debug actif dans l'écran d'édition d'une vue."
COM_CONTENTBUILDERNG_HELP_BACK_TO_VIEWS="Retour aux vues"
COM_CONTENTBUILDERNG_HELP_VIEW_TITLE="Configuration de la vue"
COM_CONTENTBUILDERNG_HELP_VIEW_INTRO="Cet écran configure une vue : la source de données, les champs à afficher, les permissions d'accès et le comportement du formulaire."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_1="Commencez par la source de données et le contexte d'affichage (frontend, backend, ou les deux)."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_2="Définissez les permissions avant de configurer les champs."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_3="Testez avec au moins deux profils utilisateurs avant de publier."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_WHAT="À quoi sert cet écran ?"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_WHAT_TEXT="Cet écran permet de configurer tous les aspects d'une vue : la source de données, chaque onglet de configuration (liste, détail, édition, permissions, options avancées) et l'état de publication."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE="Source de données"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE_TEXT="Reliez la vue à un formulaire BreezingForms ou à un stockage ContentBuilder NG. Sans source valide, aucun champ ne peut être configuré et la vue ne sera pas fonctionnelle."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE_WARN="Sans source de données valide, la vue ne fonctionnera pas."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_TABS="Onglets de configuration"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_TABS_TEXT="La vue se configure via plusieurs onglets : Source (lien vers les données), Liste (colonnes, filtres, ordre, pagination), Détail (template de fiche), Édition (template de formulaire), Permissions (droits d'accès par groupe), Options (état, note, langue, filtres avancés)."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG="Mode Debug de la vue"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_TEXT="Le mode Debug fournit des informations de diagnostic propres à cette vue sans nécessiter le mode Debug global de Joomla. Il s'applique aux affichages frontend de liste, de détail et d'édition générés par la vue."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_ENABLE="Activez Debug à droite de Publié dans l'onglet Vue, enregistrez la vue, puis sélectionnez les informations à exposer dans l'onglet Debug. Un badge DEBUG confirme que le mode est actif sur le frontend."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_FRONTEND="Le panneau de diagnostic frontend est replié par défaut. Selon les options sélectionnées, il affiche l'identifiant de l'enregistrement courant, les permissions calculées, les filtres actifs et les entrées de log CBNG produites pendant la requête courante."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_WARN="Désactivez ce mode après le diagnostic. Les informations de débogage sont affichées aux utilisateurs qui peuvent accéder à la vue et peuvent révéler des identifiants internes, des permissions, des filtres ou des messages techniques."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_PROD="Avant de mettre en production"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_PROD_TEXT="Vérifiez les permissions pour chaque groupe concerné, testez la liste, la fiche détail et le formulaire d'édition, et assurez-vous que les validations côté serveur fonctionnent correctement pour chaque champ."
COM_CONTENTBUILDERNG_HELP_STORAGES_TITLE="Stockages"
COM_CONTENTBUILDERNG_HELP_STORAGES_INTRO="Un stockage représente la structure de données d'un formulaire : ses colonnes, ses champs et ses enregistrements."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_1="Créez un stockage par formulaire à persister."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_2="Synchronisez la table après tout ajout ou suppression de champ."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_3="L'état de publication et l'ordre sont purement cosmétiques."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHAT="À quoi sert cet écran ?"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHAT_TEXT="Cet écran liste tous les stockages de données de votre site. Chaque stockage correspond à une table en base de données qui conserve les saisies de vos visiteurs pour un formulaire donné."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHEN="Quand créer un stockage ?"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHEN_TEXT="Créez un nouveau stockage dès que vous avez besoin de persister une nouvelle structure de données — par exemple un formulaire de contact, d'inscription ou de commande. Un seul stockage par formulaire suffit dans la plupart des cas."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC="Synchronisation des champs"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC_TEXT="Lorsque vous modifiez la structure d'un formulaire (ajout, suppression ou renommage d'un champ), la table en base de données ne se met pas à jour automatiquement. Utilisez l'action Synchroniser pour aligner la structure de la table avec la définition actuelle du formulaire."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC_WARN="Une désynchronisation peut provoquer des erreurs d'enregistrement ou des données manquantes."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE="État de publication et ordre"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_ON="Publié : le stockage est actif et peut recevoir des données."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_OFF="Dépublié : le stockage est désactivé ; les nouveaux enregistrements seront refusés."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_ORDER="L'ordre d'affichage n'a pas d'impact fonctionnel — il sert uniquement à garder cette liste administrable lorsque vous gérez de nombreux stockages."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_LIST="Colonnes de la liste des stockages"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_LIST_TEXT="Survolez un titre de colonne pour afficher une description de son contenu. Les titres triables restent cliquables et modifient l'ordre de la liste."
COM_CONTENTBUILDERNG_HELP_BACK_TO_STORAGES="Retour aux stockages"
COM_CONTENTBUILDERNG_HELP_STORAGE_TITLE="Stockage"
COM_CONTENTBUILDERNG_HELP_STORAGE_INTRO="Cet écran configure un stockage : sa table SQL, ses champs et les opérations de maintenance (création, synchronisation, import CSV)."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_1="Choisissez un nom SQL stable dès le départ — un renommage ultérieur nécessite une migration manuelle."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_2="Exécutez Datatable Sync après tout changement de structure."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_3="Testez toujours un import CSV avec un petit échantillon avant un import complet."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_PARAMS="Paramètres principaux"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_PARAMS_TEXT="Le nom technique identifie la table SQL (évitez les changements fréquents). Le titre est le libellé affiché dans l'administration. Le mode interne crée et gère la table automatiquement ; le mode externe se connecte à une table existante. L'état de publication active ou désactive le stockage."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_TOOLBAR="Barre d'outils"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_TOOLBAR_TEXT="Enregistrer crée ou renomme automatiquement la table SQL en mode interne. Datatable Sync aligne la structure de la table sur les champs déclarés — à utiliser après tout changement de structure. Supprimer les champs retire les champs sélectionnés de la liste."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_FIELDS="Gestion des champs"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_FIELDS_TEXT="Choisissez un nom SQL stable dès le départ — un renommage ultérieur nécessite une migration manuelle. Définissez un label clair pour l'administration. Validez que les types de champs correspondent aux données réelles avant la mise en production."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_CSV="Import CSV"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_CSV_TEXT="Vérifiez le séparateur et l'encodage avant chaque import. L'option Supprimer les enregistrements vide les données existantes avant l'import — utilisez-la avec précaution. Testez toujours avec un petit échantillon avant un import complet."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_ERRORS="Erreurs fréquentes"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_ERRORS_TEXT="Renommage de table : faites une sauvegarde SQL avant toute modification. Incohérence champs/table : exécutez Datatable Sync après tout changement de structure. Import incomplet : vérifiez le délimiteur CSV, l'encodage et les colonnes attendues. Conflits de nom : ne réutilisez pas un nom de colonne existant avec un type différent."
COM_CONTENTBUILDERNG_HELP_ABOUT_TITLE="Aide - À propos"
COM_CONTENTBUILDERNG_HELP_ABOUT_INTRO="ContentBuilder NG est un composant Joomla low-code de gestion d'applications de données. Il permet de modéliser les données, créer des formulaires, afficher des listes et des détails, et piloter les workflows par configuration."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_1="Architecture principale : les Stockages de données définissent les tables/champs physiques, et les Vues définissent les règles métier et le rendu."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_2="Sorties de vues : configurez les formulaires de création/édition, les vues liste, les vues détail et le mode dernier enregistrement depuis un même paramétrage."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_3="Permissions et gouvernance : gérez les droits voir/créer/éditer/supprimer/publier par groupe, avec options propriétaire et contrôle d'état."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_4="Recherche et navigation : paramétrez filtres, tri, pagination, catégories et intégrations de filtres externes pour les jeux de données volumineux."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_5="Intégration articles Joomla : liez les enregistrements aux articles avec options de catégorie, langue, publication et impacts de synchronisation."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_6="Opérations sur les données : importez CSV/XLSX/XLS, synchronisez le schéma de stockage et utilisez la réparation d'encodage si nécessaire."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_7="Validation et extensibilité : utilisez les règles de validation de champ intégrées, les extensions de validation, les plugins d'actions de liste, les plugins de contenu, ainsi que les templates et scripts personnalisés."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_8="Contexte frontend/backend : choisissez où chaque vue est exposée et adaptez l'expérience entre utilisateurs publics et administrateurs."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_9="Exploitation et fiabilité : testez avec plusieurs profils, surveillez les performances sur listes importantes et maintenez une procédure de sauvegarde/reprise."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_10="Utilitaires de l'écran À propos : vérifiez la version et les bibliothèques détectées, lancez l'audit de base (index, tables historiques, interclassements), puis exécutez Réparation DB (migration des données compactées + normalisation des interclassements)."
COM_CONTENTBUILDERNG_HELP_BACK_TO_ABOUT="Retour à la page À propos"
COM_CONTENTBUILDERNG_ABOUT_EXTENSIONS_MANAGE_PLUGINS="Gérer les plugins"
COM_CONTENTBUILDERNG_HELP_CONFIG_TRANSFER_TITLE="Aide - Transfert de configuration"
COM_CONTENTBUILDERNG_HELP_CONFIG_TRANSFER_INTRO="L'écran Transfert de configuration permet d'exporter ou d'importer tout ou partie de la configuration de ContentBuilder NG."
COM_CONTENTBUILDERNG_HELP_CONFIG_TRANSFER_POINT_1="Utilisez les onglets Exporter/Importer pour choisir le workflow, puis sélectionnez les sections à inclure."
COM_CONTENTBUILDERNG_HELP_CONFIG_TRANSFER_POINT_2="En export, vous pouvez filtrer finement les vues et les stockages, puis générer un fichier JSON."
COM_CONTENTBUILDERNG_HELP_CONFIG_TRANSFER_POINT_3="En import, privilégiez le mode Fusion (merge) pour conserver l'existant; utilisez Remplacer uniquement pour un reset contrôlé."
