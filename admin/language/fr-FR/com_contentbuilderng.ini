COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_MINMAX="plus petite / plus grande valeur numérique du champ ; les dates ISO retournent la valeur la plus ancienne / récente ; sinon 0 (nécessite field=NomDuChamp)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_AVG="moyenne arithmétique des valeurs numériques individuelles retenues ; les valeurs vides et non numériques sont ignorées (nécessite field=NomDuChamp)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_CHARTS="histogramme vertical, courbe ou radar responsive utilisant les mêmes valeurs normalisées. Le radar est optimal avec 4 à 6 axes."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_FILTER_HINT="<strong class='d-block mb-1'>Filtrer sur un autre champ</strong><span class='d-block mb-1'><code>field=</code> désigne le champ affiché. <code>filter[field]</code> désigne le champ utilisé pour filtrer les enregistrements et <code>filter[value]</code> accepte des alternatives séparées par <code>|</code>. Le caractère <code>*</code> est un joker et les espaces autour des séparateurs sont ignorés.</span><span class='d-block mb-2'><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><strong class='d-block mb-1'>Raccourci lorsque le filtre porte sur le même champ</strong><span class='d-block mb-1'><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><span class='d-block mb-3'>Ici, <code>value=</code> est uniquement le raccourci de <code>filter[field]=Element-2</code> avec <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code>, car les champs affiché et filtré sont identiques. Lorsque les champs diffèrent, continuez à utiliser <code>filter[field]</code> et <code>filter[value]</code>.</span><strong class='d-block h6 mb-2'>Exemples de filtres</strong><strong class='d-block mb-1'>Valeur exacte, joker * et alternatives |</strong><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km&quot; output=total}</code></span><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km*&quot; output=total}</code></span><span class='d-block mb-1'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km* | 300 km*&quot; output=total}</code></span><span class='d-block mb-2'><code>&quot;200 km&quot;</code> recherche uniquement la valeur exacte. <code>&quot;200 km*&quot;</code> sélectionne toutes les valeurs commençant par <code>200 km</code>. <code>|</code> combine plusieurs valeurs ou jokers ; les espaces autour du séparateur sont ignorés.</span><strong class='d-block mb-1'>Filtrer un autre champ</strong><span class='d-block'><code>{CBStats id=15 field=Route filter[field]=Categorie filter[value]=&quot;Gravel | Route&quot; output=bar}</code></span><span class='d-block mb-2'><code>field</code> est regroupé et affiché ; <code>filter[field]</code> sert uniquement au filtrage. Ces champs peuvent être différents.</span><strong class='d-block mb-1'>Raccourci avec value=</strong><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km*&quot; output=bar}</code></span><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km* | 300 km*&quot; output=bar}</code></span><span class='d-block mb-2'>Lorsque le filtre porte sur le champ indiqué par <code>field=</code>, <code>value=</code> équivaut à <code>filter[field]=Route</code> avec <code>filter[value]=&quot;200 km* | 300 km*&quot;</code>. Pour un autre champ, utilisez <code>filter[field]</code> et <code>filter[value]</code>.</span><strong class='d-block mb-1'>Important</strong><span class='d-block'>Ne confondez pas <code>value=</code>, qui filtre le champ indiqué par <code>field=</code>, avec <code>values=</code>, réservé exclusivement à <code>source=manual</code>.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_IDSUM_HINT="<strong class='d-block mb-1'>Fusionner de deux à cinq vues avec idsum</strong><span class='d-block mb-1'><code>idsum=15+16</code> remplace <code>id=</code> ; ils ne peuvent pas être utilisés ensemble. Les identifiants doivent être des entiers positifs uniques séparés par <code>+</code> et écrits sans guillemets.</span><span class='d-block'><code>{CBStats idsum=15+16 field=&quot;Parcours&quot; output=&quot;table&quot; labels=&quot;title=Monticyclo / Montigravel&quot;}</code></span><span class='d-block mb-1'><code>{CBStats idsum=15+16+17+18+19 field=&quot;Distance&quot; output=&quot;bar&quot; labels=&quot;title=BRM&quot;}</code></span><span class='d-block'>Chaque vue applique d’abord les droits et les filtres. Les libellés exactement identiques sont ensuite additionnés entre les vues, puis <code>add=</code>, la normalisation à zéro, <code>titles=</code>, le tri et l’output sont appliqués une seule fois. Une vue absente ou inaccessible, un champ absent, un identifiant invalide ou dupliqué et <code>output=view_name</code> sont refusés.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_SORT_ADD_HINT="Table, JSON, Pie et Bar acceptent sort=none|title|value. Utilisez dir=asc pour un ordre croissant ou dir=desc pour un ordre décroissant. Exemples : <code>{CBStats id=15 field=Parcours output=bar sort=value dir=asc}</code> et <code>{CBStats id=15 field=Parcours output=bar sort=value dir=desc}</code>. add='Libellé=EntierSigné' applique des deltas cumulatifs positifs, nuls ou négatifs. Si le résultat final de add est négatif, CBStats utilise temporairement 0 avant titles, le tri, les pourcentages et l'output, sans modifier les données sources. Pour Table, Pie et Bar, labels='total=Titre du total :' personnalise le libellé du total ; titles='Original=Titre affiché' renomme les libellés des catégories après add et avant le tri. sort=title utilise donc les titres finaux des catégories. Deux titres affichés identiques restent des catégories distinctes. Ordre de traitement : données → filtres → regroupement → add → normalisation → titles → tri → output."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_TITLE_HINT="<p class='mb-1'><code>labels=&quot;total=...&quot;</code> personnalise le libellé du total affiché pour Table, Pie et Bar.</p><p class='mb-1'><code>titles=</code> personnalise les libellés individuels des catégories.</p><p class='mb-1'>CBStats ajoute le séparateur adapté à la langue active lorsqu’il est absent et ne double pas un caractère « : » déjà présent.</p><p class='mb-0'>Exemples : <code>👥 Total des inscrits : 106</code> en français et <code>Total: 106</code> en anglais.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_HEADERS_HINT="<p class='mb-1'><code>labels='category=Département;value=Qté'</code> personnalise uniquement les deux en-têtes de colonnes de <code>output=table</code>.</p><p class='mb-1'>Utilisez les clés stables <code>title</code>, <code>category</code>, <code>value</code> et <code>total</code>. Les clés inconnues, dupliquées ou vides sont refusées.</p><p class='mb-1'><code>labels=</code> contrôle les textes de présentation ; <code>titles=</code> renomme les catégories de données. Les légendes Pie et Bar restent inchangées.</p><p class='mb-0'><code>export=manual</code> conserve <code>labels=</code> afin que la sortie Table manuelle garde les mêmes en-têtes.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_URL_HINT="L'URL/API accepte json, total, sum, min, max et view_name. JSON accepte aussi les paramètres communs add, titles, sort et dir. Table, Pie et Bar restent réservés aux contenus. Les mêmes ACL et permissions s'appliquent."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ACL_HINT="Dans la vue, vérifiez <strong>API + Droits</strong>, les champs publiés et autorisés pour API/Stats, la permission STATS et l'onglet <strong>API</strong>. L'URL/API CBStats exige STATS ; les autres routes peuvent exiger API plus les droits affichés. Les balises d'article appliquent également les droits de la vue et du champ."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ERROR_HINT="Lorsque DEBUG est désactivé sur la vue, les réponses publiques restent sobres, par exemple <code>Requête invalide.</code>. Avec DEBUG activé, les diagnostics sûrs peuvent identifier les paramètres CBStats invalides. Les balises d'article demandent les détails avec <code>debug=1</code> ; l'URL/API suit directement le réglage de la vue. DEBUG ne donne aucun droit et ne contourne jamais les ACL."
