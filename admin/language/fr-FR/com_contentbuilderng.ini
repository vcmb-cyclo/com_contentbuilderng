COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_INTRO="CBStats insère directement dans les contenus Joomla des statistiques calculées à partir de cette vue ContentBuilder NG. Table, JSON, Pie et Bar partagent le même moteur PHP normalisé."
