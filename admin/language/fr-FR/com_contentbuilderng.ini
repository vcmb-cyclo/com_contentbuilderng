COM_CONTENTBUILDERNG_HELP_CONTEXT_TITLE="ContentBuilder NG — Aide : %s"
COM_CONTENTBUILDERNG_HELP_CONTEXT_CURRENT_TAB="Onglet actif"
COM_CONTENTBUILDERNG_HELP_CONTEXT_NAV="Rubriques d’aide de la vue"
COM_CONTENTBUILDERNG_HELP_CONTEXT_WORKFLOW="Méthode de travail"
COM_CONTENTBUILDERNG_HELP_CONTEXT_CHECKS="Contrôles essentiels"
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_PURPOSE="Cette aide décrit chaque onglet de configuration d’une vue ContentBuilder NG."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_WORKFLOW="Configure d’abord les éléments dans Vue, puis les options frontend, les templates et enfin les permissions. Utilise Prévisualiser avant publication."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_CHECKS="Enregistre la vue après chaque groupe de changements et vérifie les indicateurs des onglets, l’audit et le résultat frontend."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_WARNING="Une vue peut être valide techniquement mais inaccessible si ses boutons et permissions ne correspondent pas."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_PURPOSE="Définit les éléments disponibles et leurs fonctions dans la liste, le détail, l’édition, la recherche, l’API et l’export."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_WORKFLOW="Sélectionne les lignes puis utilise Actions pour publier, lister, rechercher, lier, afficher en détail, éditer, exposer par API ou exporter. Le sélecteur de colonnes masque seulement des colonnes de cet écran."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_CHECKS="Un élément doit être publié pour être utilisé. Export exige en plus Export activé. Détail exige un élément lié et Édition un élément modifiable."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_WARNING="Les actions s’appliquent uniquement aux lignes cochées ; une colonne masquée dans l’administration n’est pas automatiquement désactivée."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_PURPOSE="Règle le comportement général de la liste frontend, ses commandes, son tri et sa pagination."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_WORKFLOW="Définis les valeurs par défaut de la vue. Les options d’un élément de menu Joomla peuvent ensuite les remplacer pour un affichage précis."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_CHECKS="Vérifie les boutons Nouveau/Éditer, les actions de liste, la pagination, le thème et les options de sécurité avant publication."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_WARNING="Un bouton visible ne donne aucun droit : la permission frontend correspondante doit également être accordée."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_PURPOSE="Configure le texte affiché au-dessus de la liste frontend."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_WORKFLOW="Saisis le contenu dans l’éditeur. Actions permet de réinitialiser complètement l’introduction avec confirmation et enregistrement automatique."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_CHECKS="Prévisualise la vue pour contrôler le HTML, les liens et l’espacement avec le template Joomla actif."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_WARNING="La réinitialisation efface tout le contenu de l’introduction."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_PURPOSE="Configure les états métier, leur publication, leur libellé, leur couleur et leur action optionnelle."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_WORKFLOW="Publie uniquement les états utiles. Utilise Actions pour nettoyer les lignes inactives, restaurer la palette ou désactiver les états de la vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_CHECKS="Pour être opérationnels, les états exigent au moins un état publié, l’affichage activé et la permission State."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_WARNING="Désactiver les états conserve les données existantes, mais retire leur utilisation dans cette vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_PURPOSE="Configure le template utilisé pour afficher un enregistrement en lecture."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_WORKFLOW="Choisis les barres haute/basse, crée ou régénère le template depuis Actions, puis adapte le HTML et Prepare si le template n’est pas verrouillé."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_CHECKS="L’accès exige la permission View, un template valide et au moins un élément publié et lié depuis l’onglet Vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_WARNING="Avec le cadenas actif, chaque enregistrement de la vue régénère le template depuis les éléments actuels."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_PURPOSE="Configure le formulaire frontend de création et de modification des enregistrements."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_WORKFLOW="Règle les barres, le verrouillage, l’éditeur spécifique et le dossier d’upload, puis crée ou régénère le template dans Actions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_CHECKS="La coche Édition exige la permission Edit, un accès depuis la liste ou Détail, un template valide et au moins un champ publié éditable. Désactiver le bouton Modifier de la liste ne retire pas la coche si l’accès via Détail reste actif. Sans permission Edit ou sans aucun de ces accès, aucun symbole fonctionnel n’est affiché. Le cadenas reste indépendant. New ne participe pas à ce check. Le formulaire technique reste partagé. Les droits de chaque utilisateur sur chaque enregistrement sont vérifiés en frontend."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_WARNING="Désactiver Édition ne désactive pas New ; seule la réinitialisation complète retire les deux fonctions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_PURPOSE="Configure la création et la synchronisation optionnelles d’articles Joomla à partir des enregistrements."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WORKFLOW="Choisis la catégorie, la langue, l’accès, les dates de publication et l’impact des modifications ou suppressions d’enregistrements."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_CHECKS="Une catégorie valide est requise lorsque la création d’articles est active. Vérifie aussi les droits Joomla de création et de modification d’articles."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WARNING="La réinitialisation restaure toutes les options Article ; contrôle notamment la catégorie avant de réactiver la génération."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_PURPOSE="Configure les fonctions API et documente l’intégration CBStats et CBList dans les articles Joomla."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WORKFLOW="Active uniquement les endpoints nécessaires, accorde leurs permissions, puis utilise les exemples courts et ouvre les manuels complets CBStats/CBList."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_CHECKS="Teste chaque endpoint avec un utilisateur possédant exactement les droits prévus. CBStats et CBList respectent les ACL et la configuration de la vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WARNING="Une API activée sans permission reste inaccessible ; une permission trop large peut exposer des données."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_PURPOSE="Configure les notifications envoyées lors de la création ou de la modification d’un enregistrement."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WORKFLOW="Définis les destinataires, l’objet et le corps, puis teste avec les mêmes droits et le même parcours que les utilisateurs réels."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_CHECKS="Vérifie les adresses, les marqueurs de champs, la configuration mail Joomla et les permissions New/Edit."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WARNING="Un modèle d’e-mail valide ne sera pas envoyé si l’action déclenchante ou l’envoi Joomla échoue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_PURPOSE="Définit précisément les groupes autorisés à afficher, créer, modifier, changer l’état, exporter ou utiliser l’API."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WORKFLOW="Accorde le minimum nécessaire par fonction. Utilise les droits propriétaire uniquement lorsque le traitement doit être limité aux enregistrements de l’utilisateur."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_CHECKS="Compare les permissions avec les boutons et fonctions activés dans les autres onglets, puis teste avec un compte non Super User."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WARNING="Un test Super User ne révèle pas les permissions manquantes ou excessives des groupes ordinaires."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_PURPOSE="Analyse les incohérences de configuration, de templates, de permissions et d’éléments."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WORKFLOW="Traite d’abord les erreurs, puis les avertissements. Retourne dans l’onglet indiqué, corrige et enregistre avant de relancer l’audit."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_CHECKS="Une configuration destinée à la production ne doit conserver aucune erreur bloquante inexpliquée."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WARNING="L’audit signale les incohérences connues mais ne remplace pas un test frontend avec les ACL réelles."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_PURPOSE="Présente les mesures utiles pour identifier les opérations coûteuses de la vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WORKFLOW="Mesure après avoir reproduit un cas réel, puis compare les requêtes, durées et volumes avant et après optimisation."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_CHECKS="Contrôle surtout les filtres, tris, champs calculés, templates et volumes exportés."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WARNING="Le mode Debug et les traces peuvent modifier les temps observés ; désactive-les pour la mesure finale."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_PURPOSE="Affiche les informations techniques sur la source et la structure de données utilisées par la vue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WORKFLOW="Utilise ces informations pour vérifier les identifiants, champs système, correspondances et diagnostics de stockage."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_CHECKS="Confirme que la source et les éléments attendus correspondent à la vue avant toute intervention SQL ou migration."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WARNING="Cet écran est diagnostique : ne modifie jamais directement la base sans sauvegarde et procédure contrôlée."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_PURPOSE="Active temporairement les informations techniques nécessaires au diagnostic."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WORKFLOW="Active uniquement les traces utiles, reproduis le problème, collecte les informations puis désactive Debug."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_CHECKS="Vérifie les identifiants BF/CB, permissions, filtres, requêtes et journaux selon le problème étudié."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WARNING="Debug peut révéler des informations sensibles et ne doit pas rester actif en production."
