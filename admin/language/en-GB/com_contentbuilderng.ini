COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_DISPLAY_OPTIONS_HINT="<strong class='d-block mb-1'>Limit values and hide presentation elements</strong><span class='d-block'><code>limit=10</code> keeps the first 10 values after <code>sort=</code> and <code>dir=</code>. Numeric options are written without quotation marks.</span><span class='d-block'><code>hide=&quot;title|total|values|graph&quot;</code> accepts combinations separated by <code>|</code>. <code>title</code> hides a block or Card heading defined by <code>labels=&quot;title=...&quot;</code>; <code>values</code> hides the textual labels and values list; <code>graph</code> keeps that lightweight textual list. Hiding all three result elements is rejected. The former <code>total=hide</code> syntax is no longer supported.</span><span class='d-block'><code>{CBStats id=15 field=&quot;Group&quot; output=&quot;bar&quot; labels=&quot;title=Distribution&quot; hide=&quot;title|values&quot; card=v1}</code></span><span class='d-block'><code>{CBStats id=15 field=&quot;Town&quot; output=&quot;radar&quot; hide=&quot;graph|total&quot;}</code></span><span class='d-block'><code>index.php?option=com_contentbuilderng&amp;task=api.display&amp;format=json&amp;action=cbstats&amp;id=15&amp;field=Town&amp;output=bar&amp;hide=graph%7Ctotal</code></span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_GROUPS_HINT="<strong class='d-block mb-1'>Value groups</strong><span class='d-block'><code>groups=&quot;18-24;25-29;30+&quot;</code> defines inclusive numeric intervals. <code>groups=&quot;1,2,7,9=Group 1;3,4,8=Group 2&quot;</code> groups explicit, non-contiguous values under display labels. Declaration order is preserved; overlaps are allowed and every group is counted independently. Values that match no group remain individual categories after the groups.</span><span class='d-block'>With <code>groups=</code>, the displayed total is the sum of all displayed results after grouping and limiting. Overlapping groups can therefore count one record more than once. Use <code>output=total</code> for the real filtered record count. Inline <code>groups=</code> has priority over <code>groupset=</code>, and <code>titles=</code> can override group labels. Radar is recommended with 4 to 6 axes.</span>"
