COM_CONTENTBUILDERNG_HELP_CONTEXT_CHECKS="Essential checks"
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_PURPOSE="This help describes every tab used to configure a ContentBuilder NG view."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_WORKFLOW="Configure elements in View first, then frontend options, templates and permissions. Use Preview before publishing."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_CHECKS="Save after each group of changes and verify tab indicators, Audit and the frontend result."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OVERVIEW_WARNING="A view can be technically valid but inaccessible when its buttons and permissions do not match."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_PURPOSE="Defines available elements and their roles in lists, details, editing, search, API and export."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_WORKFLOW="Select rows, then use Actions to publish, list, search, link, show details, edit, expose through API or export. The column selector only hides columns on this administrator screen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_CHECKS="An element must be published before use. Export also requires Export enabled, Detail requires a linked element, and Edit requires an editable element."
COM_CONTENTBUILDERNG_HELP_CONTEXT_VIEW_WARNING="Actions affect checked rows only; hiding an administrator column does not disable its function."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_PURPOSE="Controls general frontend list behaviour, commands, sorting and pagination."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_WORKFLOW="Define the view defaults here. A Joomla menu item can override them for a specific display."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_CHECKS="Check New/Edit buttons, list actions, pagination, theme and security options before publishing."
COM_CONTENTBUILDERNG_HELP_CONTEXT_OPTIONS_WARNING="A visible button grants no access by itself; the matching frontend permission is also required."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_PURPOSE="Configures the content displayed above the frontend list."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_WORKFLOW="Enter content in the editor. Actions can completely reset the introduction with confirmation and automatic saving."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_CHECKS="Preview the view to check HTML, links and spacing with the active Joomla template."
COM_CONTENTBUILDERNG_HELP_CONTEXT_INTRO_WARNING="Reset permanently clears all introduction content after saving."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_PURPOSE="Configures business states, publication, labels, colours and optional actions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_WORKFLOW="Publish only useful states. Use Actions to clean inactive rows, restore the palette or disable states for the view."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_CHECKS="Operational states require at least one published state, state display enabled and the State permission."
COM_CONTENTBUILDERNG_HELP_CONTEXT_STATES_WARNING="Disabling states preserves existing data but removes state use from this view."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_PURPOSE="Configures the read-only template used to display one record."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_WORKFLOW="Choose top/bottom bars, create or regenerate the template from Actions, then adapt HTML and Prepare when the template is unlocked."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_CHECKS="Access requires View permission, a valid template and at least one published linked element in the View tab."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DETAIL_WARNING="With the lock enabled, every view save regenerates the template from current elements."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_PURPOSE="Configures the frontend form for creating and editing records."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_WORKFLOW="Set bars, locking, type-specific editor and upload directory, then create or regenerate the template from Actions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_CHECKS="The Edit check requires Edit permission, access from the list or Details, a valid template and at least one published editable field. Disabling the list Edit button keeps the check when access through Details remains active. Without Edit permission or either entry point, no functional indicator is shown. The lock remains independent. New does not affect this check. The technical form remains shared. Individual user permissions for each record are checked in the frontend."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_WARNING="Disabling Edit does not disable New; only Full reset removes both functions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_PURPOSE="Configures optional Joomla article creation and synchronisation from records."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WORKFLOW="Choose category, language, access, publication dates and the effect of record changes or deletion."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_CHECKS="A valid category is required when article creation is enabled. Also check Joomla article create/edit permissions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WARNING="Reset restores every Article option; check the category before enabling generation again."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_PURPOSE="Configures API functions and documents CBStats and CBList integration in Joomla articles."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WORKFLOW="Enable only required endpoints, grant their permissions, then use the short examples and open the complete CBStats/CBList manuals."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_CHECKS="Test each endpoint with a user holding exactly the intended rights. CBStats and CBList respect view ACL and configuration."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WARNING="An API without permission remains unavailable; overly broad permission can expose data."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_PURPOSE="Configures notifications sent when records are created or changed."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WORKFLOW="Set recipients, subject and body, then test with the same rights and workflow as real users."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_CHECKS="Check addresses, field markers, Joomla mail configuration and New/Edit permissions."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WARNING="A valid email template is not sent when its triggering action or Joomla mail delivery fails."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_PURPOSE="Precisely controls groups allowed to view, create, edit, change state, export or use the API."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WORKFLOW="Grant the minimum required per function. Use owner permissions only when processing must be limited to a user's own records."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_CHECKS="Compare permissions with buttons and functions enabled in other tabs, then test with a non-Super User account."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WARNING="A Super User test does not expose missing or excessive permissions for normal groups."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_PURPOSE="Finds configuration, template, permission and element inconsistencies."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WORKFLOW="Resolve errors first, then warnings. Return to the named tab, correct and save before rerunning Audit."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_CHECKS="A production configuration should contain no unexplained blocking error."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WARNING="Audit detects known inconsistencies but does not replace frontend testing with real ACL."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_PURPOSE="Shows measurements used to identify expensive view operations."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WORKFLOW="Measure after reproducing a real case, then compare queries, durations and volumes before and after optimisation."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_CHECKS="Focus on filters, sorting, calculated fields, templates and exported volumes."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WARNING="Debug and tracing can affect timings; disable them for final measurements."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_PURPOSE="Displays technical information about the view's data source and structure."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WORKFLOW="Use it to verify identifiers, system fields, mappings and storage diagnostics."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_CHECKS="Confirm that the source and expected elements match the view before SQL work or migration."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WARNING="This screen is diagnostic: never modify the database directly without a backup and controlled procedure."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_PURPOSE="Temporarily enables technical information required for diagnosis."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WORKFLOW="Enable only useful traces, reproduce the issue, collect information, then disable Debug."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_CHECKS="Check BF/CB identifiers, permissions, filters, queries and logs according to the investigated issue."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WARNING="Debug can reveal sensitive information and must not remain enabled in production."
