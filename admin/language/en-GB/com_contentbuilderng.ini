COM_CONTENTBUILDERNG_HELP_VIEWS_TITLE="Views"
COM_CONTENTBUILDERNG_HELP_VIEWS_INTRO="A view controls the full lifecycle of your records: list display, detail page, edit form, permissions and workflow."
COM_CONTENTBUILDERNG_HELP_VIEWS_POINT_1="Create one view per functional use case (public submission, back-office list, detail page, internal workflow)."
COM_CONTENTBUILDERNG_HELP_VIEWS_POINT_2="Configure source and permissions first, then fields, ordering, pagination and filters."
COM_CONTENTBUILDERNG_HELP_VIEWS_POINT_3="Test with at least two user roles before going live."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_WHAT="What is this screen for?"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_WHAT_TEXT="This screen lists all views on your site. Each view defines how a form or storage is rendered on the frontend (list, detail, edit) and the rules that govern record access and behavior."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_DESIGN="Designing a view"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_DESIGN_TEXT="Create one view per clearly identified use case: public submission, back-office list, detail page, internal workflow. An explicit name and a well-defined data source prevent overly generic views that become hard to maintain."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG="Recommended setup order"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG_TEXT="Start with the data source and permissions (view, create, edit, publish), then move on to fields (list inclusion, search, linkable, editable), ordering, pagination, filters, theme plugins and advanced options."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_CONFIG_WARN="Configuring permissions last is a frequent source of errors — set them up first."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_PROD="Going live"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_PROD_TEXT="Before making a view public: test workflows with at least two different user roles, verify validation messages and error feedback, confirm mass-action and publication behavior, and check performance on a large list."
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_LIST="View list controls"
COM_CONTENTBUILDERNG_HELP_VIEWS_SEC_LIST_TEXT="Hover over a column heading to display its description; sortable headings remain clickable. The Debug column appears immediately before Published. A green bug icon means that view Debug is enabled and can be clicked to disable it. Use Actions > Debug or Actions > No debug to update all selected views at once. The same green bug icon identifies enabled Debug on the view edit screen."
COM_CONTENTBUILDERNG_HELP_BACK_TO_VIEWS="Back to Views"
COM_CONTENTBUILDERNG_HELP_VIEW_TITLE="View Configuration"
COM_CONTENTBUILDERNG_HELP_VIEW_INTRO="This screen configures a single view: data source, displayed fields, access permissions and form behavior."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_1="Start with the data source and display context (frontend, backend, or both)."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_2="Set permissions before configuring fields."
COM_CONTENTBUILDERNG_HELP_VIEW_POINT_3="Test with at least two user roles before publishing."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_WHAT="What is this screen for?"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_WHAT_TEXT="This screen lets you configure all aspects of a view: the data source, each display tab (list, detail, edit, permissions, advanced options) and the publication state."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE="Data source"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE_TEXT="Link the view to a BreezingForms form or a ContentBuilder NG storage. Without a valid source, no fields can be configured and the view will not work."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_SOURCE_WARN="Without a valid data source, the view will not function."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_TABS="Configuration tabs"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_TABS_TEXT="The view is configured through several tabs — Source (data link), List (columns, filters, ordering, pagination), Detail (record display template), Edit (entry form template), Permissions (access rights by group), Options (state, rating, language, advanced filters)."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG="View Debug mode"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_TEXT="Debug mode provides diagnostics for this view without requiring Joomla global Debug mode. It applies to the frontend list, detail and edit displays generated by the view."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_ENABLE="Enable Debug next to Published in the View tab, save the view, then select the information to expose in the Debug tab. A DEBUG badge confirms that the mode is active on the frontend."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_FRONTEND="The frontend diagnostic panel is collapsed by default. Depending on the selected options, it shows the current record identifier, resolved permissions, active filters and CBNG log entries generated during the current request."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_DEBUG_WARN="Disable this mode after diagnosis. Debug information is displayed to users who can access the view and may reveal internal identifiers, permissions, filters or technical log messages."
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_PROD="Before going live"
COM_CONTENTBUILDERNG_HELP_VIEW_SEC_PROD_TEXT="Check permissions for each relevant group, test the list view, the detail page and the edit form, and make sure server-side validation works correctly for each field."
COM_CONTENTBUILDERNG_HELP_STORAGES_TITLE="Data Storages"
COM_CONTENTBUILDERNG_HELP_STORAGES_INTRO="A storage represents the data structure of a form: its columns, fields and records."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_1="Create one storage per form you need to persist."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_2="Synchronize the table after each field addition or removal."
COM_CONTENTBUILDERNG_HELP_STORAGES_POINT_3="Publish state and ordering are for display purposes only."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHAT="What is this screen for?"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHAT_TEXT="This screen lists all data storages on your site. Each storage maps to a database table that holds visitor submissions for a given form."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHEN="When to create a storage?"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_WHEN_TEXT="Create a new storage whenever you need to persist a new data structure — for example a contact, registration or order form. One storage per form is sufficient in most cases."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC="Field synchronization"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC_TEXT="When you change the structure of a form (adding, removing or renaming a field), the database table is not updated automatically. Use the Synchronize action to align the table structure with the current form definition."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_SYNC_WARN="An out-of-sync table can cause save errors or missing data."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE="Publish state and ordering"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_ON="Published: the storage is active and can receive data."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_OFF="Unpublished: the storage is disabled; new records will be rejected."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_STATE_ORDER="Display order has no functional impact — it only helps keep the list manageable when you have many storages."
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_LIST="Storage list columns"
COM_CONTENTBUILDERNG_HELP_STORAGES_SEC_LIST_TEXT="Hover over a column heading to display a description of its contents. Sortable headings remain clickable and change the list ordering."
COM_CONTENTBUILDERNG_HELP_BACK_TO_STORAGES="Back to Data Storages"
COM_CONTENTBUILDERNG_HELP_STORAGE_TITLE="Data Storage"
COM_CONTENTBUILDERNG_HELP_STORAGE_INTRO="This screen configures a single storage: its SQL table, fields and maintenance operations (creation, synchronization, CSV import)."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_1="Choose a stable SQL name from the start — renaming later requires a manual migration."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_2="Run Datatable Sync after every structural change."
COM_CONTENTBUILDERNG_HELP_STORAGE_POINT_3="Always test a CSV import with a small sample first."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_PARAMS="Main parameters"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_PARAMS_TEXT="The technical name identifies the SQL table (avoid frequent changes). The title is the label shown in the administration. Internal mode creates and manages the table automatically; external mode connects to an existing table. The publish state enables or disables the storage."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_TOOLBAR="Toolbar"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_TOOLBAR_TEXT="Save automatically creates or renames the SQL table in internal mode. Datatable Sync aligns the table structure with the declared fields — use it after any structural change. Delete fields removes the selected fields."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_FIELDS="Field management"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_FIELDS_TEXT="Choose a stable SQL name from the start — renaming later requires a manual migration. Set a clear label for the administration. Verify that field types match the actual data before going live."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_CSV="CSV import"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_CSV_TEXT="Check the separator and encoding before each import. The Drop records option clears existing data before the import — use it carefully. Always test with a small sample before a full import."
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_ERRORS="Common mistakes"
COM_CONTENTBUILDERNG_HELP_STORAGE_SEC_ERRORS_TEXT="Table rename: make a SQL backup before any modification. Field/table mismatch: run Datatable Sync after any structural change. Incomplete import: check CSV delimiter, encoding and expected columns. Name conflicts: do not reuse an existing column name with a different type."
COM_CONTENTBUILDERNG_HELP_ABOUT_TITLE="Help - About"
COM_CONTENTBUILDERNG_HELP_ABOUT_INTRO="ContentBuilder NG is a low-code data application component for Joomla. It helps you model data, build forms and list/detail pages, and control record workflows from configuration."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_1="Core architecture: Data Storages define physical tables and fields, while Views define business behavior and rendering."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_2="View outputs: configure create/edit forms, list views, record details, and latest-record behavior from one configuration set."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_3="Permissions and governance: manage view/create/edit/delete/publish rights by user group, with owner-specific options and state control."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_4="Search and navigation: configure filters, sorting, pagination, categories, and optional external filter integrations for large datasets."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_5="Article integration: map records to Joomla articles, with category/language/publication options and synchronization impacts."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_6="Data operations: import CSV/XLSX/XLS files, synchronize storage schema, and use encoding repair when source files are inconsistent."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_7="Validation and extensibility: use built-in field validation rules, validation extensions, list-action plugins, content plugins, and custom templates/scripts to adapt behavior."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_8="Frontend and backend contexts: define where each view is available and tailor UX for public users and administrators."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_9="Maintenance and reliability: test with multiple roles, monitor list performance on large volumes, and keep backup/rollback procedures."
COM_CONTENTBUILDERNG_HELP_ABOUT_POINT_10="About screen utilities: review component version and detected libraries, run database audit checks (indexes, historical tables, collations), and execute DB Repair (packed-data migration + collation normalization)."
COM_CONTENTBUILDERNG_HELP_BACK_TO_ABOUT="Back to About"
