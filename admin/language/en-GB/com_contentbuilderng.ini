COM_CONTENTBUILDERNG_EXTENSION_USAGE_VALIDATION_EQUAL="Add \"equal\" to the field's Select validations setting, and create a second field named <field name>_repeat (e.g. \"password_repeat\" for a field named \"password\"). Validation fails when the two field values do not match."
