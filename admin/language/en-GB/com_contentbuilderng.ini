COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_JSON="JSON array of {label,value} value/count objects (requires field=FieldName)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_PIE="responsive Pie chart with percentages, detailed legend and total (requires field=FieldName)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_BAR="responsive horizontal Bar chart with values, percentages, detailed legend and total (requires field=FieldName)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_SUM="weighted sum of the numeric field values, or 0 if any value is non-numeric (requires field=FieldName)."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_MINMAX="smallest / largest numeric field value; ISO dates return the earliest / latest value; otherwise 0 (requires field=FieldName)."
