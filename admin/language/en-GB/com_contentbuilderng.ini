COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_OUTPUT_CHARTS="responsive vertical histogram, line chart or radar using the same normalized values. Radar is optimal with 4 to 6 axes."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_FILTER_HINT="<strong class='d-block mb-1'>Filtering on another field</strong><span class='d-block mb-1'><code>field=</code> specifies the displayed field. <code>filter[field]</code> specifies the field used to filter records, and <code>filter[value]</code> accepts alternatives separated by <code>|</code>. The <code>*</code> character is a wildcard and surrounding spaces are ignored.</span><span class='d-block mb-2'><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><strong class='d-block mb-1'>Shortcut when filtering on the same field</strong><span class='d-block mb-1'><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><span class='d-block mb-3'>Here, <code>value=</code> is only a shorthand for <code>filter[field]=Element-2</code> with <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code>, because the displayed and filtered fields are the same. When the fields differ, continue to use <code>filter[field]</code> and <code>filter[value]</code>.</span><strong class='d-block h6 mb-2'>Filter examples</strong><strong class='d-block mb-1'>Exact value, wildcard * and alternatives |</strong><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km&quot; output=total}</code></span><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km*&quot; output=total}</code></span><span class='d-block mb-1'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km* | 300 km*&quot; output=total}</code></span><span class='d-block mb-2'><code>&quot;200 km&quot;</code> matches only the exact value. <code>&quot;200 km*&quot;</code> selects every value beginning with <code>200 km</code>. <code>|</code> combines several values or wildcards; surrounding spaces are ignored.</span><strong class='d-block mb-1'>Filtering another field</strong><span class='d-block'><code>{CBStats id=15 field=Route filter[field]=Categorie filter[value]=&quot;Gravel | Route&quot; output=bar}</code></span><span class='d-block mb-2'><code>field</code> is grouped and displayed; <code>filter[field]</code> is used only for filtering. These fields may be different.</span><strong class='d-block mb-1'>Shortcut using value=</strong><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km*&quot; output=bar}</code></span><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km* | 300 km*&quot; output=bar}</code></span><span class='d-block mb-2'>When filtering the field specified by <code>field=</code>, <code>value=</code> is equivalent to <code>filter[field]=Route</code> with <code>filter[value]=&quot;200 km* | 300 km*&quot;</code>. For another field, use <code>filter[field]</code> and <code>filter[value]</code>.</span><strong class='d-block mb-1'>Important</strong><span class='d-block'>Do not confuse <code>value=</code>, which filters the field specified by <code>field=</code>, with <code>values=</code>, which is reserved exclusively for <code>source=manual</code>.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_IDSUM_HINT="<strong class='d-block mb-1'>Merging two to five views with idsum</strong><span class='d-block mb-1'><code>idsum=15+16</code> is an alternative to <code>id=</code>; they cannot be used together. Identifiers must be unique positive integers separated by <code>+</code> and written without quotation marks.</span><span class='d-block'><code>{CBStats idsum=15+16 field=&quot;Route&quot; output=&quot;table&quot; labels=&quot;title=Monticyclo / Montigravel&quot;}</code></span><span class='d-block mb-1'><code>{CBStats idsum=15+16+17+18+19 field=&quot;Distance&quot; output=&quot;bar&quot; labels=&quot;title=BRM&quot;}</code></span><span class='d-block'>Each view applies access checks and filters first. Exact labels are then added across views, followed once by <code>add=</code>, zero normalization, <code>titles=</code>, sorting and output. Missing or inaccessible views, missing fields, invalid or duplicate identifiers and <code>output=view_name</code> are rejected.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_SORT_ADD_HINT="Table, JSON, Pie and Bar accept sort=none|title|value. Use dir=asc for ascending order or dir=desc for descending order. Examples: <code>{CBStats id=15 field=Route output=bar sort=value dir=asc}</code> and <code>{CBStats id=15 field=Route output=bar sort=value dir=desc}</code>. add='Label=SignedInteger' applies cumulative positive, zero or negative deltas. If the final add result is negative, CBStats temporarily uses 0 before titles, sorting, percentages and output without changing source data. For Table, Pie and Bar, labels='total=Custom total:' customizes the total label; titles='Original=Display title' renames category labels after add and before sorting. sort=title therefore uses final category titles. Identical display titles remain distinct categories. Processing order: data → filters → grouping → add → normalization → titles → sorting → output."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_TITLE_HINT="<p class='mb-1'><code>labels=&quot;total=...&quot;</code> customizes the displayed-total label for Table, Pie and Bar.</p><p class='mb-1'><code>titles=</code> customizes individual category labels.</p><p class='mb-1'>CBStats appends the separator for the active language when it is omitted and does not duplicate an existing colon.</p><p class='mb-0'>Examples: <code>👥 Total registrations: 106</code> in English and <code>Total : 106</code> in French.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_HEADERS_HINT="<p class='mb-1'><code>labels='category=Distance;value=Participants'</code> customizes only the two column headers of <code>output=table</code>.</p><p class='mb-1'>Use the stable keys <code>title</code>, <code>category</code>, <code>value</code> and <code>total</code>. Unknown, duplicate or empty keys are rejected.</p><p class='mb-1'><code>labels=</code> controls presentation text; <code>titles=</code> renames data categories. Pie and Bar legends remain unchanged.</p><p class='mb-0'><code>export=manual</code> preserves <code>labels=</code> so the manual Table output keeps the same headers.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_URL_HINT="URL/API supports json, total, sum, min, max and view_name. JSON also accepts the common add, titles, sort and dir parameters. Table, Pie and Bar remain content-only. The same ACL and permissions apply."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ACL_HINT="In the view, check <strong>API + Rights</strong>, published fields enabled for API/Stats, the STATS permission and the <strong>API</strong> tab. CBStats URL/API requires STATS; other routes can require API plus the displayed rights. Article tags also enforce view and field permissions."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ERROR_HINT="With view DEBUG disabled, public responses remain concise, such as <code>Invalid request.</code>. With DEBUG enabled, safe diagnostics can identify invalid CBStats parameters. Article tags request details with <code>debug=1</code>; URL/API follows the view setting directly. DEBUG grants no right and never bypasses ACLs."
