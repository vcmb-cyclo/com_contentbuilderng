COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_DISPLAY_OPTIONS_HINT="<strong class='d-block mb-1'>Werte begrenzen und Darstellungselemente ausblenden</strong><span class='d-block'><code>limit=10</code> behält die ersten 10 Werte nach <code>sort=</code> und <code>dir=</code>. Numerische Optionen werden ohne Anführungszeichen geschrieben.</span><span class='d-block'><code>hide=&quot;title|total|values|graph&quot;</code> akzeptiert Kombinationen, getrennt durch <code>|</code>. <code>title</code> blendet einen mit <code>labels=&quot;title=...&quot;</code> definierten Block- oder Card-Titel aus; <code>values</code> blendet die textuelle Beschriftungs- und Werteliste aus; <code>graph</code> behält diese leichte Textliste bei. Alle drei Ergebniselemente gemeinsam werden abgelehnt. Die frühere Syntax <code>total=hide</code> wird nicht mehr unterstützt.</span><span class='d-block'><code>{CBStats id=15 field=&quot;Gruppe&quot; output=&quot;bar&quot; labels=&quot;title=Verteilung&quot; hide=&quot;title|values&quot; card=v1}</code></span><span class='d-block'><code>{CBStats id=15 field=&quot;Ort&quot; output=&quot;radar&quot; hide=&quot;graph|total&quot;}</code></span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_GROUPS_HINT="<strong class='d-block mb-1'>Wertgruppen</strong><span class='d-block'><code>groups=&quot;18-24;25-29;30+&quot;</code> definiert inklusive numerische Intervalle. <code>groups=&quot;1,2,7,9=Gruppe 1;3,4,8=Gruppe 2&quot;</code> gruppiert explizite, nicht zusammenhängende Werte unter Anzeigebezeichnungen. Die Deklarationsreihenfolge bleibt erhalten; Überschneidungen sind erlaubt und jede Gruppe wird unabhängig gezählt. Werte, die keiner Gruppe entsprechen, bleiben nach den Gruppen einzelne Kategorien.</span><span class='d-block'>Mit <code>groups=</code> ist die angezeigte Summe die Summe aller nach Gruppierung und Begrenzung dargestellten Ergebnisse. Überlappende Gruppen können einen Datensatz daher mehrfach zählen. Verwenden Sie <code>output=total</code> für die reale gefilterte Datensatzanzahl. Inline-<code>groups=</code> hat Vorrang vor <code>groupset=</code>, und <code>titles=</code> kann Gruppenbezeichnungen überschreiben. Für Radar werden 4 bis 6 Achsen empfohlen.</span>"
