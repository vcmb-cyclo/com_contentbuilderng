COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_CHECKS="Das Häkchen für Bearbeiten erfordert die Edit-Berechtigung, einen Zugang über die Liste oder die Detailansicht, ein gültiges Template und mindestens ein veröffentlichtes bearbeitbares Feld. Das Deaktivieren der Bearbeiten-Schaltfläche in der Liste entfernt das Häkchen nicht, wenn der Zugang über die Detailansicht aktiv bleibt. Ohne Edit-Berechtigung oder ohne beide Zugänge wird kein Funktionssymbol angezeigt. Das Schloss bleibt unabhängig. Neu beeinflusst dieses Häkchen nicht. Das technische Formular bleibt gemeinsam. Die Benutzerrechte für jeden Datensatz werden im Frontend geprüft."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EDIT_WARNING="Bearbeiten deaktivieren deaktiviert Neu nicht; nur Vollständig zurücksetzen entfernt beide Funktionen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_PURPOSE="Konfiguriert optionale Erstellung und Synchronisierung von Joomla-Artikeln aus Datensätzen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WORKFLOW="Kategorie, Sprache, Zugriff, Veröffentlichungsdaten und Auswirkungen von Datensatzänderung oder -löschung wählen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_CHECKS="Bei aktiver Artikelerstellung ist eine gültige Kategorie nötig. Auch Joomla-Rechte zum Erstellen/Bearbeiten prüfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_ARTICLE_WARNING="Zurücksetzen stellt alle Artikeloptionen wieder her; Kategorie vor erneuter Aktivierung prüfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_PURPOSE="Konfiguriert API-Funktionen und dokumentiert CBStats/CBList in Joomla-Artikeln."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WORKFLOW="Nur benötigte Endpunkte aktivieren, Berechtigungen vergeben, Kurzbeispiele verwenden und vollständige CBStats/CBList-Handbücher öffnen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_CHECKS="Jeden Endpunkt mit einem Benutzer testen, der genau die vorgesehenen Rechte besitzt. CBStats und CBList beachten ACL und Ansichtskonfiguration."
COM_CONTENTBUILDERNG_HELP_CONTEXT_API_WARNING="Eine API ohne Berechtigung bleibt unerreichbar; zu breite Rechte können Daten offenlegen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_PURPOSE="Konfiguriert Benachrichtigungen beim Erstellen oder Ändern eines Datensatzes."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WORKFLOW="Empfänger, Betreff und Inhalt festlegen und mit Rechten sowie Ablauf realer Benutzer testen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_CHECKS="Adressen, Feldmarker, Joomla-Mailkonfiguration und Neu/Bearbeiten-Berechtigungen prüfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_EMAILS_WARNING="Ein gültiges E-Mail-Template wird nicht versandt, wenn auslösende Aktion oder Joomla-Mailversand fehlschlägt."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_PURPOSE="Steuert genau, welche Gruppen anzeigen, erstellen, bearbeiten, Status ändern, exportieren oder API verwenden dürfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WORKFLOW="Pro Funktion nur nötige Rechte vergeben. Eigentümerrechte nur verwenden, wenn Verarbeitung auf eigene Datensätze begrenzt werden soll."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_CHECKS="Berechtigungen mit aktivierten Schaltflächen/Funktionen anderer Reiter vergleichen und mit einem Nicht-Super-User testen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERMISSIONS_WARNING="Ein Super-User-Test zeigt fehlende oder übermäßige Rechte normaler Gruppen nicht."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_PURPOSE="Findet Inkonsistenzen in Konfiguration, Templates, Berechtigungen und Elementen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WORKFLOW="Zuerst Fehler, dann Warnungen beheben. Zum genannten Reiter wechseln, korrigieren, speichern und Audit erneut starten."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_CHECKS="Eine Produktionskonfiguration sollte keinen ungeklärten blockierenden Fehler enthalten."
COM_CONTENTBUILDERNG_HELP_CONTEXT_AUDIT_WARNING="Audit erkennt bekannte Inkonsistenzen, ersetzt aber keinen Frontend-Test mit realen ACL."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_PURPOSE="Zeigt Messwerte zum Erkennen aufwendiger Ansichtsoperationen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WORKFLOW="Nach Reproduktion eines realen Falls messen und Abfragen, Laufzeiten und Mengen vor/nach Optimierung vergleichen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_CHECKS="Besonders Filter, Sortierung, berechnete Felder, Templates und Exportmengen prüfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_PERFORMANCE_WARNING="Debug und Tracing können Zeiten beeinflussen; für die Endmessung deaktivieren."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_PURPOSE="Zeigt technische Informationen zu Datenquelle und Struktur der Ansicht."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WORKFLOW="Zum Prüfen von Kennungen, Systemfeldern, Zuordnungen und Speicherdiagnosen verwenden."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_CHECKS="Vor SQL-Arbeit oder Migration bestätigen, dass Quelle und erwartete Elemente zur Ansicht passen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DATA_WARNING="Dieser Bildschirm dient der Diagnose: Datenbank nie ohne Sicherung und kontrolliertes Verfahren direkt ändern."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_PURPOSE="Aktiviert vorübergehend technische Informationen für die Diagnose."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WORKFLOW="Nur nützliche Traces aktivieren, Problem reproduzieren, Informationen sammeln und Debug danach deaktivieren."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_CHECKS="Je nach Problem BF/CB-Kennungen, Berechtigungen, Filter, Abfragen und Protokolle prüfen."
COM_CONTENTBUILDERNG_HELP_CONTEXT_DEBUG_WARNING="Debug kann sensible Informationen zeigen und darf in Produktion nicht aktiv bleiben."
