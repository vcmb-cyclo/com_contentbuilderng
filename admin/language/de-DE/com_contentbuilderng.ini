COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_FILTER_HINT="<strong class='d-block mb-1'>Nach einem anderen Feld filtern</strong><span class='d-block mb-1'><code>field=</code> bezeichnet das angezeigte Feld. <code>filter[field]</code> bezeichnet das zum Filtern der Datensätze verwendete Feld und <code>filter[value]</code> akzeptiert durch <code>|</code> getrennte Alternativen. Das Zeichen <code>*</code> ist ein Platzhalter und Leerzeichen um die Trennzeichen werden ignoriert.</span><span class='d-block mb-2'><code>{CBStats id=15 field=Element-1 filter[field]=Element-2 filter[value]=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><strong class='d-block mb-1'>Kurzform beim Filtern desselben Feldes</strong><span class='d-block mb-1'><code>{CBStats id=15 field=Element-2 value=&quot;Dét* | 3 | 4&quot; output=bar}</code></span><span class='d-block mb-3'>Hier ist <code>value=</code> nur die Kurzform für <code>filter[field]=Element-2</code> mit <code>filter[value]=&quot;Dét* | 3 | 4&quot;</code>, da das angezeigte und das gefilterte Feld identisch sind. Bei unterschiedlichen Feldern verwenden Sie weiterhin <code>filter[field]</code> und <code>filter[value]</code>.</span><strong class='d-block h6 mb-2'>Filterbeispiele</strong><strong class='d-block mb-1'>Exakter Wert, Platzhalter * und Alternativen |</strong><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km&quot; output=total}</code></span><span class='d-block'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km*&quot; output=total}</code></span><span class='d-block mb-1'><code>{CBStats id=15 filter[field]=NomDuChamp filter[value]=&quot;200 km* | 300 km*&quot; output=total}</code></span><span class='d-block mb-2'><code>&quot;200 km&quot;</code> sucht nur nach dem exakten Wert. <code>&quot;200 km*&quot;</code> wählt alle Werte aus, die mit <code>200 km</code> beginnen. <code>|</code> kombiniert mehrere Werte oder Platzhalter; Leerzeichen um das Trennzeichen werden ignoriert.</span><strong class='d-block mb-1'>Ein anderes Feld filtern</strong><span class='d-block'><code>{CBStats id=15 field=Route filter[field]=Categorie filter[value]=&quot;Gravel | Route&quot; output=bar}</code></span><span class='d-block mb-2'><code>field</code> wird gruppiert und angezeigt; <code>filter[field]</code> dient ausschließlich zum Filtern. Diese Felder dürfen unterschiedlich sein.</span><strong class='d-block mb-1'>Kurzform mit value=</strong><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km*&quot; output=bar}</code></span><span class='d-block'><code>{CBStats id=15 field=Route value=&quot;200 km* | 300 km*&quot; output=bar}</code></span><span class='d-block mb-2'>Beim Filtern des mit <code>field=</code> angegebenen Feldes entspricht <code>value=</code> der Kombination aus <code>filter[field]=Route</code> und <code>filter[value]=&quot;200 km* | 300 km*&quot;</code>. Für ein anderes Feld verwenden Sie <code>filter[field]</code> und <code>filter[value]</code>.</span><strong class='d-block mb-1'>Wichtig</strong><span class='d-block'>Verwechseln Sie <code>value=</code>, das das mit <code>field=</code> angegebene Feld filtert, nicht mit <code>values=</code>, das ausschließlich für <code>source=manual</code> bestimmt ist.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_IDSUM_HINT="<strong class='d-block mb-1'>Zwei bis fünf Ansichten mit idsum zusammenführen</strong><span class='d-block mb-1'><code>idsum=15+16</code> ersetzt <code>id=</code>; beide können nicht gemeinsam verwendet werden. Kennungen müssen eindeutige positive Ganzzahlen sein, die durch <code>+</code> getrennt und ohne Anführungszeichen geschrieben werden.</span><span class='d-block'><code>{CBStats idsum=15+16 field=&quot;Strecke&quot; output=&quot;table&quot; labels=&quot;title=Monticyclo / Montigravel&quot;}</code></span><span class='d-block mb-1'><code>{CBStats idsum=15+16+17+18+19 field=&quot;Distanz&quot; output=&quot;bar&quot; labels=&quot;title=BRM&quot;}</code></span><span class='d-block'>Jede Ansicht wendet zuerst Zugriffsprüfung und Filter an. Exakt gleiche Bezeichnungen werden anschließend ansichtsübergreifend addiert; danach werden <code>add=</code>, Nullnormalisierung, <code>titles=</code>, Sortierung und Ausgabe einmalig angewendet. Fehlende oder unzugängliche Ansichten, fehlende Felder, ungültige oder doppelte Kennungen und <code>output=view_name</code> werden abgelehnt.</span>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_SORT_ADD_HINT="Tabelle, JSON, Kreis- und Balkendiagramm unterstützen sort=none|title|value. Verwenden Sie dir=asc für aufsteigende oder dir=desc für absteigende Sortierung. Beispiele: <code>{CBStats id=15 field=Strecke output=bar sort=value dir=asc}</code> und <code>{CBStats id=15 field=Strecke output=bar sort=value dir=desc}</code>. add='Bezeichnung=VorzeichenbehafteteGanzzahl' wendet kumulative positive, Null- oder negative Deltas an. Ist das endgültige add-Ergebnis negativ, verwendet CBStats vor titles, Sortierung, Prozentberechnung und Ausgabe vorübergehend 0, ohne die Quelldaten zu ändern. Für Tabelle, Kreis- und Balkendiagramm passt labels='total=Benutzerdefinierte Gesamtbezeichnung:' die Gesamtbezeichnung an; titles='Original=Anzeigetitel' benennt Kategoriebezeichnungen nach add und vor der Sortierung um. sort=title verwendet daher die endgültigen Kategorietitel. Identische Anzeigetitel bleiben getrennte Kategorien. Verarbeitungsreihenfolge: Daten → Filter → Gruppierung → add → Normalisierung → titles → Sortierung → Ausgabe."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_TITLE_HINT="<p class='mb-1'><code>labels=&quot;total=...&quot;</code> passt die Bezeichnung der angezeigten Summe für Tabelle, Kreis- und Balkendiagramm an.</p><p class='mb-1'><code>titles=</code> passt die Bezeichnungen einzelner Kategorien an.</p><p class='mb-1'>CBStats ergänzt das Trennzeichen der aktiven Sprache, wenn es fehlt, und verdoppelt einen vorhandenen Doppelpunkt nicht.</p><p class='mb-0'>Beispiele: <code>👥 Gesamtzahl der Anmeldungen: 106</code> auf Deutsch und <code>Total : 106</code> auf Französisch.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_HEADERS_HINT="<p class='mb-1'><code>labels='category=Distanz;value=Teilnehmer'</code> passt nur die zwei Spaltenüberschriften von <code>output=table</code> an.</p><p class='mb-1'>Verwenden Sie die stabilen Schlüssel <code>title</code>, <code>category</code>, <code>value</code> und <code>total</code>. Unbekannte, doppelte oder leere Schlüssel werden abgelehnt.</p><p class='mb-1'><code>labels=</code> steuert Darstellungstexte; <code>titles=</code> benennt Datenkategorien um. Die Legenden von Kreis- und Balkendiagrammen bleiben unverändert.</p><p class='mb-0'><code>export=manual</code> behält <code>labels=</code> bei, damit die manuelle Tabellenausgabe dieselben Überschriften verwendet.</p>"
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_URL_HINT="URL/API unterstützt json, total, sum, min, max und view_name. JSON akzeptiert außerdem die gemeinsamen Parameter add, titles, sort und dir. Tabelle, Kreis- und Balkendiagramm bleiben Inhalten vorbehalten. Es gelten dieselben ACLs und Berechtigungen."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ACL_HINT="Prüfen Sie in der Ansicht <strong>API + Rechte</strong>, veröffentlichte und für API/Stats freigegebene Felder, die STATS-Berechtigung sowie den <strong>API</strong>-Tab. CBStats-URL/API erfordert STATS; andere Routen können API plus die angezeigten Rechte erfordern. Artikel-Tags beachten ebenfalls Ansichts- und Feldberechtigungen."
COM_CONTENTBUILDERNG_API_CONTENT_PLUGIN_ERROR_HINT="Bei deaktiviertem DEBUG bleiben öffentliche Antworten knapp, zum Beispiel <code>Ungültige Anfrage.</code>. Bei aktiviertem DEBUG können sichere Diagnosen ungültige CBStats-Parameter benennen. Artikel-Tags fordern Details mit <code>debug=1</code> an; URL/API folgt direkt der Ansichtseinstellung. DEBUG gewährt kein Recht und umgeht niemals ACLs."
