COM_CONTENTBUILDERNG_API_CBSTATS_EXPORT_TITLE="Export der manuellen Syntax"
COM_CONTENTBUILDERNG_API_CBSTATS_EXPORT_HELP="Mit <code>export=manual</code> werden der endgültige Titel, die Werte und die Summe zusammen mit einer vollständigen sichtbaren <code>source=manual</code>-Syntax und einer zentrierten Kopierschaltfläche angezeigt. Exportiert werden die endgültig dargestellten Ergebnisse nach Filtern, Ergänzungen, <code>titles=</code>, Sortierung, Richtung und Korrektur negativer Werte. Die endgültigen Kategoriebezeichnungen werden direkt in <code>values=</code> geschrieben; <code>titles=</code> wird nicht kopiert. Nur der genaue Wert <code>manual</code> aktiviert den Export; andere Exportwerte werden ignoriert."
