name: Test and Build Package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version from the component manifest
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - com_contentbuilderng_update.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' \
            -not -path './admin/vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  lint:
    name: XML, translation and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Validate XML files
        run: |
          find . -type f -name '*.xml' \
            -not -path './admin/vendor/*' \
            -print0 | xargs -0 xmllint --noout

      - name: Check package and update stream versions
        run: |
          manifest_version="$(grep -oPm1 '(?<=<version>)[^<]+' com_contentbuilderng.xml)"
          update_version="$(grep -oPm1 '(?<=<version>)[^<]+' com_contentbuilderng_update.xml)"
          if ! php -r 'exit(version_compare($argv[1], $argv[2], "<=") ? 0 : 1);' \
            "${update_version}" "${manifest_version}"; then
            echo "::error::Update stream ${update_version} is newer than package ${manifest_version}."
            exit 1
          fi

      - name: Check translations
        run: python3 scripts/check-translations.py

      - name: Audit Composer dependencies
        working-directory: admin
        run: composer audit --locked --no-interaction

  code-style:
    name: PSR-12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        working-directory: admin
        run: composer install --prefer-dist --no-interaction --no-progress

      # Global gate: REFACTORING_PLAN.md chapter A cleared every file listed
      # in phpcs.xml.dist down to 0 errors (verified 2026-08-01). Files still
      # excluded there (EditModel.php and its chapter-D siblings, the legacy
      # types/ sources, three plugins) are skipped by the ruleset itself, not
      # by this job — narrow that list as each one is cleared instead of
      # loosening this gate.
      #
      # -n: errors block, warnings do not. PSR-12 warns on things like a
      # 121-character line, which isn't worth failing a build over.
      - name: PSR-12 (blocking)
        run: admin/vendor/bin/phpcs -n --report=full

  css-lint:
    name: CSS checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install CSS lint dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: admin
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        working-directory: admin
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Cache extracted Joomla core stubs
        id: joomla-stubs-cache
        uses: actions/cache@v6
        with:
          path: joomla-stubs
          key: joomla-stubs-6.1.2-php8.4

      - name: Extract Joomla core for class discovery
        if: steps.joomla-stubs-cache.outputs.cache-hit != 'true'
        run: |
          container="$(docker create joomla:6.1.2-php8.4-apache)"
          mkdir -p joomla-stubs
          docker cp "${container}:/usr/src/joomla/libraries" joomla-stubs/libraries
          docker rm "${container}"

      - name: Reject PHPStan baseline growth
        run: |
          baseline_max_lines=1639
          baseline_lines="$(wc -l < phpstan-baseline.neon)"
          if [ "${baseline_lines}" -gt "${baseline_max_lines}" ]; then
            echo "::error::phpstan-baseline.neon grew from ${baseline_max_lines} to ${baseline_lines} lines."
            exit 1
          fi

      - name: Run PHPStan
        run: admin/vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --error-format=github

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl
          tools: composer:v2
          coverage: ${{ matrix.php-version == '8.4' && 'pcov' || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: admin
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install test dependencies
        working-directory: admin
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run unit tests
        if: matrix.php-version != '8.4'
        working-directory: admin
        run: vendor/bin/phpunit

      - name: Run unit tests and generate coverage reports
        if: matrix.php-version == '8.4'
        working-directory: admin
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage/clover.xml \
            --coverage-html=coverage/html \
            --coverage-text

      - name: Enforce coverage threshold
        if: matrix.php-version == '8.4'
        run: php scripts/check-coverage.php admin/coverage/clover.xml 5

      - name: Upload coverage reports
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage
          path: admin/coverage
          retention-days: 14

  package:
    name: Build and smoke-test package
    needs: [php-compatibility, lint, code-style, css-lint, unit-tests, phpstan]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: admin
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-8.4-

      - name: Set package creation date
        run: |
          creation_date="$(TZ=Europe/Paris date +%F)"
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          perl -0pi -e "s#<creationDate>.*?</creationDate>#<creationDate>${creation_date}</creationDate>#" com_contentbuilderng.xml
          perl -0pi -e "s#\\n\\s*<buildType>.*?</buildType>##g; s#(<creationDate>.*?</creationDate>)#\$1\n    <buildType>production</buildType>#" com_contentbuilderng.xml
          perl -0pi -e "s#\\n\\s*<buildTimestamp>.*?</buildTimestamp>##g; s#(<buildType>.*?</buildType>)#\$1\n    <buildTimestamp>${build_timestamp}</buildTimestamp>#" com_contentbuilderng.xml

      - name: Build production package
        id: package
        run: echo "archive=$(scripts/build-package.sh)" >> "$GITHUB_OUTPUT"

      - name: Validate package contents
        run: scripts/validate-package.sh "${{ steps.package.outputs.archive }}"

      - name: Test installation, update and migration on Joomla
        run: scripts/joomla-install-smoke.sh "${{ steps.package.outputs.archive }}"

      - name: Upload installation package
        uses: actions/upload-artifact@v7
        with:
          name: installation-package
          path: ${{ steps.package.outputs.archive }}
          retention-days: 14

  release:
    name: Publish release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true &&
      github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installation package
        uses: actions/download-artifact@v8
        with:
          name: installation-package
          path: build

      - name: Resolve release metadata
        id: release
        run: |
          version="$(grep -oPm1 '(?<=<version>)[^<]+' com_contentbuilderng.xml)"
          archive="build/com_contentbuilderng-${version}.zip"
          test -f "${archive}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          if tagged_sha="$(git rev-list -n 1 "v${version}" 2>/dev/null)" && [ "${tagged_sha}" != "${GITHUB_SHA}" ]; then
            echo "::notice::Version v${version} is already published from ${tagged_sha}; skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate package checksum
        if: steps.release.outputs.publish == 'true'
        id: checksum
        run: |
          sha256="$(sha256sum "${{ steps.release.outputs.archive }}" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          archive="${{ steps.release.outputs.archive }}"
          is_rc=false
          if [[ "${tag}" =~ -RC[0-9]{2}$ ]]; then
            is_rc=true
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${archive}" --clobber
            if [ "${is_rc}" = true ]; then
              gh release edit "${tag}" --draft=false --prerelease
            else
              gh release edit "${tag}" --draft=false
            fi
          else
            if [ "${is_rc}" = true ]; then
              gh release create "${tag}" \
                "${archive}" \
                --target "${GITHUB_SHA}" \
                --title "ContentBuilder NG ${tag#v}" \
                --generate-notes \
                --prerelease \
                --latest=false
            else
              gh release create "${tag}" \
                "${archive}" \
                --target "${GITHUB_SHA}" \
                --title "ContentBuilder NG ${tag#v}" \
                --generate-notes
            fi
          fi

      - name: Publish update manifest to main
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_version="${{ steps.release.outputs.version }}"
          release_url="https://github.com/vcmb-cyclo/com_contentbuilderng/releases/download/v${release_version}/com_contentbuilderng-${release_version}.zip"
          gh release view "v${release_version}" --json assets \
            --jq '.assets[].name' | grep -Fx "com_contentbuilderng-${release_version}.zip"
          RELEASE_VERSION="${release_version}" RELEASE_URL="${release_url}" \
            perl -0pi -e '
              s#(<version>)[^<]*(</version>)#$1$ENV{RELEASE_VERSION}$2#;
              s#(<downloadurl type="full" format="zip">)[^<]*(</downloadurl>)#$1$ENV{RELEASE_URL}$2#;
              s#\n\s*<sha256>.*?</sha256>##g;
              s#(\n\s*</downloads>)#\n\t\t<sha256>${{ steps.checksum.outputs.sha256 }}</sha256>$1#;
            ' com_contentbuilderng_update.xml
          if git diff --quiet -- com_contentbuilderng_update.xml; then
            echo "Update manifest already current."
            exit 0
          fi
          git add com_contentbuilderng_update.xml
          git commit -m "Publish update manifest for ${{ steps.release.outputs.version }}"
          git push origin main
